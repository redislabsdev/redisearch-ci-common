name: Build RedisJSON (cached)
description: |
  Build RedisJSON with RediSearch's tests/deps/setup_rejson.sh and cache
  rejson.so, keyed on (resolved RedisJSON SHA, platform, arch, sanitizer,
  coverage, C compiler and build flags, pinned nightly toolchain). On a cache
  hit the binary is restored; on a miss it is built and saved.

  On completion $GITHUB_WORKSPACE/bin/rejson.so exists (built or restored) and
  is returned as the `rejson-path` output. With `export-rejson-path: 'true'`
  (the default) REJSON_PATH is also exported to $GITHUB_ENV, so later steps
  that source setup_rejson.sh reuse it instead of cloning and building.

  Container-safe: every step is inline; nothing is read from the action path.
inputs:
  rejson-branch:
    description: "RedisJSON git ref to build (branch, tag, or 40-char SHA)"
    required: false
    default: master
  san:
    description: "Sanitizer (empty or 'address')"
    required: false
    default: ""
  cov:
    description: "Coverage build (1) or not (0)"
    required: false
    default: "0"
  cache_platform_id:
    description: "Opaque identifier for the binary-compatible platform (container image or runner env)"
    required: true
  redisearch-root:
    description: "RediSearch checkout root (holds .rust-nightly and tests/deps/setup_rejson.sh), relative to $GITHUB_WORKSPACE or absolute"
    required: false
    default: "."
  toolchain-enable:
    description: "Optional script to source before building (e.g. a devtoolset enable script), so the build and the cache key see the same compiler"
    required: false
    default: ""
  export-rejson-path:
    description: "Export REJSON_PATH to $GITHUB_ENV ('true') or only return the rejson-path output ('false')"
    required: false
    default: "true"

outputs:
  rejson-path:
    description: "Absolute path of the built or restored rejson.so"
    value: ${{ steps.resolve.outputs.binpath }}
  cache-hit:
    description: "'true' when rejson.so was restored from cache"
    value: ${{ steps.cache-restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Resolve RedisJSON SHA
      id: resolve
      shell: bash
      env:
        REJSON_REF: ${{ inputs.rejson-branch }}
        RS_ROOT: ${{ inputs.redisearch-root }}
      run: |
        if [[ "$REJSON_REF" =~ ^[0-9a-f]{40}$ ]]; then
          SHA="$REJSON_REF"
        else
          SHA=$(git ls-remote https://github.com/RedisJSON/RedisJSON.git "$REJSON_REF" \
                | awk 'NR==1 {print $1}')
        fi
        if [[ -z "$SHA" ]]; then
          echo "Failed to resolve RedisJSON ref '$REJSON_REF' to a commit SHA" >&2
          exit 1
        fi
        echo "Resolved $REJSON_REF -> $SHA"
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        # $GITHUB_WORKSPACE, not the github.workspace context: the latter is the
        # runner host path, unreachable inside container jobs.
        echo "binpath=$GITHUB_WORKSPACE/bin/rejson.so" >> "$GITHUB_OUTPUT"
        if [[ "$RS_ROOT" != /* ]]; then RS_ROOT="$GITHUB_WORKSPACE/$RS_ROOT"; fi
        if [[ ! -f "$RS_ROOT/tests/deps/setup_rejson.sh" ]]; then
          echo "redisearch-root '$RS_ROOT' has no tests/deps/setup_rejson.sh" >&2
          exit 1
        fi
        echo "root=$RS_ROOT" >> "$GITHUB_OUTPUT"

    - name: Compute cache key
      id: key
      # Same login shell and toolchain as the build step, so the compiler and
      # flags hashed here are the ones the build actually uses.
      shell: bash -leo pipefail {0}
      env:
        SHA: ${{ steps.resolve.outputs.sha }}
        RS_ROOT: ${{ steps.resolve.outputs.root }}
        PLATFORM_ID: ${{ inputs.cache_platform_id }}
        ARCH: ${{ runner.arch }}
        SAN: ${{ inputs.san }}
        COV: ${{ inputs.cov }}
        TOOLCHAIN_ENABLE: ${{ inputs.toolchain-enable }}
      run: |
        if [[ -n "$TOOLCHAIN_ENABLE" ]]; then source "$TOOLCHAIN_ENABLE"; fi
        SAN_LABEL="${SAN:-none}"
        COV_LABEL="${COV:-0}"
        # setup_rejson.sh builds with the pinned nightly (RUST_GOOD_NIGHTLY), so
        # a nightly bump must invalidate the binary even at the same RedisJSON SHA.
        NIGHTLY=$(tr -d '[:space:]' < "$RS_ROOT/.rust-nightly")
        NIGHTLY_SAFE=$(echo "$NIGHTLY" | sed 's#[^A-Za-z0-9_.-]#-#g')
        # make inherits the environment, so the C compiler (cc-built deps) and
        # any job-level compiler/linker flags shape the binary too.
        CC_DESC=$(
          { "${CC:-cc}" --version 2>/dev/null | head -1 || echo none; }
          for v in CFLAGS CXXFLAGS LDFLAGS RUSTFLAGS CARGO_ENCODED_RUSTFLAGS; do
            echo "$v=${!v-}"
          done
        )
        echo "Compiler/flags identity:"
        echo "$CC_DESC"
        if command -v sha256sum >/dev/null; then HASH=(sha256sum); else HASH=(shasum -a 256); fi
        CC_ID=$(printf '%s' "$CC_DESC" | "${HASH[@]}" | cut -c1-12)
        PLATFORM_SAFE=$(echo "$PLATFORM_ID" | sed 's#[^A-Za-z0-9_.-]#-#g')
        KEY="rejson-${SHA}-${PLATFORM_SAFE}-${ARCH}-san_${SAN_LABEL}-cov_${COV_LABEL}-cc_${CC_ID}-rust_${NIGHTLY_SAFE}"
        echo "key=$KEY" >> "$GITHUB_OUTPUT"
        echo "Cache key: $KEY"

    - name: Restore cached RedisJSON
      id: cache-restore
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ steps.resolve.outputs.binpath }}
        key: ${{ steps.key.outputs.key }}

    - name: Build RedisJSON (cache miss)
      if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
      # Login shell so a python venv activated via ~/.bash_profile is on PATH;
      # RedisJSON's readies-based Makefile needs python3.
      shell: bash -leo pipefail {0}
      env:
        SAN: ${{ inputs.san }}
        # RedisJSON's Makefile adds `-C instrument-coverage` under COV=1; set it
        # from the input so the binary always matches the cov label in the key.
        COV: ${{ inputs.cov }}
        # Build the resolved SHA, not the moving ref, so the binary matches the key.
        REJSON_BRANCH: ${{ steps.resolve.outputs.sha }}
        RS_ROOT: ${{ steps.resolve.outputs.root }}
        BINPATH: ${{ steps.resolve.outputs.binpath }}
        TOOLCHAIN_ENABLE: ${{ inputs.toolchain-enable }}
      run: |
        # No `set -u`: toolchain enable scripts commonly read unset variables.
        if [[ -n "$TOOLCHAIN_ENABLE" ]]; then source "$TOOLCHAIN_ENABLE"; fi
        # setup_rejson.sh short-circuits when REJSON_PATH is set (e.g. job-level).
        unset REJSON_PATH
        # Keep RedisJSON's build tree out of the cached path; copy out only the .so.
        export ROOT="$RS_ROOT"
        export BINROOT="$RUNNER_TEMP/rejson-build"
        mkdir -p "$BINROOT" "$(dirname "$BINPATH")"
        source "$ROOT/tests/deps/setup_rejson.sh"
        cp "$JSON_BIN_PATH" "$BINPATH"
        ls -lh "$BINPATH"

    - name: Save RedisJSON to cache
      if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ steps.resolve.outputs.binpath }}
        key: ${{ steps.key.outputs.key }}

    - name: Expose RedisJSON via REJSON_PATH
      if: ${{ inputs.export-rejson-path == 'true' }}
      shell: bash
      env:
        BINPATH: ${{ steps.resolve.outputs.binpath }}
      run: echo "REJSON_PATH=$BINPATH" >> "$GITHUB_ENV"
