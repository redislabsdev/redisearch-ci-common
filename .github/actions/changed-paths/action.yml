name: 'Changed paths (submodule-aware)'
description: |
  Did anything matching `files` / `files_ignore` change? A drop-in for
  tj-actions/changed-files' `any_modified` that also counts submodule pointer moves.

  changed-files lists the superproject's changes with
  `git diff --ignore-submodules=all` (`getAllChangedFiles` in its src/utils.ts) and
  only sees a submodule through a diff inside the submodule. Without the submodule
  checked out with history for both commits that diff fails with a warning and the
  path is dropped, so a submodule-only bump reads as "nothing changed". This action
  runs changed-files, then diffs the gitlinks in the superproject itself and matches
  the moved ones against the same globs.

  The caller must check out with `fetch-depth: 0`, as changed-files requires.

  Compare range: `pull_request` merge-base(base, head)..head; `push` before..sha;
  `merge_group` base_sha..head_sha. `base` / `head` override the event's values.

  Fails closed, unlike the best-effort units in this repo: an unknown event, an
  unresolvable or all-zero SHA, or a git error sets `changed=true` with a warning,
  because the safe failure for a "skip CI?" gate is running CI.

  Globs are matched with git `:(glob)` pathspecs, which agree with changed-files'
  micromatch (`dot: true`, `noext: true`) on `*`, `**`, `?`, `[...]`, `[^...]`,
  a leading `!`, and a trailing `/`. One difference is bridged: micromatch's
  `dir/**` also matches `dir` itself, so a `dir` pathspec is added beside it.
  Braces and groups (`{a,b}`, `(a|b)`) have no git equivalent, and micromatch
  reads `[!...]` differently from git; such a pattern makes every moved submodule
  count as matching. Only the `files` / `files_ignore` inputs
  are mirrored; changed-files' other matching options keep their defaults.

inputs:
  files:
    description: "Newline-separated globs to include, passed to changed-files unchanged."
    required: false
    default: ""
  files_ignore:
    description: "Newline-separated globs to exclude, passed to changed-files unchanged."
    required: false
    default: ""
  base:
    description: "Override the base commit of the compare range for the submodule check."
    required: false
    default: ""
  head:
    description: "Override the head commit of the compare range for the submodule check."
    required: false
    default: ""

outputs:
  changed:
    description: "'true' if a matching file changed or a matching submodule pointer moved."
    value: ${{ steps.submodules.outputs.changed }}
  submodules:
    description: "Space-separated paths of the moved submodules that match the globs."
    value: ${{ steps.submodules.outputs.submodules }}
  any_modified:
    description: "changed-files' raw `any_modified` (blind to submodule moves)."
    value: ${{ steps.changed-files.outputs.any_modified }}

runs:
  using: composite
  steps:
    - name: Check changed files
      id: changed-files
      # SHA-pinned: this action's tags were retargeted in a 2025 supply-chain attack.
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
      with:
        files: ${{ inputs.files }}
        files_ignore: ${{ inputs.files_ignore }}

    - name: Check moved submodules
      id: submodules
      shell: bash
      env:
        ANY_MODIFIED: ${{ steps.changed-files.outputs.any_modified }}
        FILES: ${{ inputs.files }}
        FILES_IGNORE: ${{ inputs.files_ignore }}
        BASE_OVERRIDE: ${{ inputs.base }}
        HEAD_OVERRIDE: ${{ inputs.head }}
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE_SHA: ${{ github.event.before }}
        MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        HEAD_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        submodules=""

        finish() {
          local changed=false
          if [ "$ANY_MODIFIED" = true ] || [ "$1" = true ]; then changed=true; fi
          echo "changed=$changed submodules=$submodules"
          { echo "changed=$changed"; echo "submodules=$submodules"; } >> "$GITHUB_OUTPUT"
          exit 0
        }
        fail_closed() {
          echo "::warning::$1; treating moved submodules as changed"
          finish true
        }

        base=$BASE_OVERRIDE
        head=$HEAD_OVERRIDE
        case "$EVENT_NAME" in
          pull_request)
            head=${head:-$PR_HEAD_SHA}
            if [ -z "$base" ]; then
              base=$(git merge-base "$PR_BASE_SHA" "$head") ||
                fail_closed "No merge base for '$PR_BASE_SHA' and '$head'"
            fi ;;
          push)
            base=${base:-$PUSH_BEFORE_SHA}
            head=${head:-$HEAD_SHA} ;;
          merge_group)
            base=${base:-$MERGE_GROUP_BASE_SHA}
            head=${head:-$MERGE_GROUP_HEAD_SHA} ;;
          *)
            if [ -z "$base" ] || [ -z "$head" ]; then
              fail_closed "No compare range for event '$EVENT_NAME'"
            fi ;;
        esac
        for sha in "$base" "$head"; do
          if [[ -z $sha || $sha =~ ^0+$ ]] || ! git rev-parse --verify --quiet "${sha}^{commit}" > /dev/null; then
            fail_closed "Cannot resolve commit '$sha'"
          fi
        done

        # From both ends, so an added or removed submodule is seen too.
        gitmodules_paths() {
          git cat-file -e "$1:.gitmodules" 2> /dev/null || return 0
          local out rc=0
          out=$(git config --blob "$1:.gitmodules" --get-regexp '^submodule\..*\.path$') || rc=$?
          [ "$rc" -le 1 ] || return "$rc" # 1: no entries
          [ -z "$out" ] || printf '%s\n' "$out" | cut -d' ' -f2-
        }
        listed=$(gitmodules_paths "$base") || fail_closed "Cannot read .gitmodules at $base"
        listed+=$'\n'$(gitmodules_paths "$head") || fail_closed "Cannot read .gitmodules at $head"
        mapfile -t paths < <(printf '%s\n' "$listed" | sed '/^$/d' | sort -u)
        [ "${#paths[@]}" -gt 0 ] || finish false

        # --ignore-submodules=none: a .gitmodules `ignore = all` would hide the move.
        diff_names() {
          git diff --name-only --no-renames --ignore-submodules=none "$base" "$head" -- "$@"
        }
        moved=$(diff_names "${paths[@]/#/:(literal)}" | grep -Fxf <(printf '%s\n' "${paths[@]}")) ||
          [ $? -eq 1 ] || fail_closed "git diff $base $head failed"
        if [ -z "$moved" ]; then
          echo "No submodule pointer moved between $base and $head"
          finish false
        fi
        echo "Submodule pointers moved between $base and $head:"
        echo "$moved"

        specs=()
        unsupported=""
        add_spec() {
          local magic=$1 p=$2
          [ -n "$p" ] || return 0
          case "$p" in *[{}\(\)\|]* | *'[!'*) unsupported+=" $p" ;; esac
          [[ $p != */ ]] || p+='**'
          specs+=(":($magic)$p")
          if [[ $p == ?*/'**' ]]; then specs+=(":($magic)${p%/\*\*}"); fi
        }
        while IFS= read -r p; do
          p=${p%$'\r'}
          if [[ $p == '!'* ]]; then add_spec glob,exclude "${p#!}"; else add_spec glob "$p"; fi
        done <<< "$FILES"
        while IFS= read -r p; do
          p=${p%$'\r'}
          add_spec glob,exclude "${p#!}"
        done <<< "$FILES_IGNORE"

        if [ -n "$unsupported" ]; then
          submodules=$(paste -sd" " <<< "$moved")
          fail_closed "Glob(s) without a git pathspec equivalent:$unsupported"
        fi
        matched=$(diff_names "${specs[@]}" | grep -Fxf <(printf '%s\n' "$moved")) ||
          [ $? -eq 1 ] || fail_closed "git diff $base $head failed"
        if [ -z "$matched" ]; then
          echo "No moved submodule matches the globs"
          finish false
        fi
        submodules=$(paste -sd" " <<< "$matched")
        finish true
